<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img">
  <title>二极管特性、负载线、Q 点与小信号切线</title>
  <desc>左图在同一坐标显示指数特性、恒压降门槛和外电路负载线，交点为 Q 点；右图放大 Q 点附近，区分直流割线和小信号切线。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#006f78"/></marker></defs>
  <style>
    .axis{stroke:#172127;fill:none;stroke-width:2}.curve{stroke:#006f78;fill:none;stroke-width:3}.load{stroke:#ad4f16;fill:none;stroke-width:3}.tangent{stroke:#5d4b8c;fill:none;stroke-width:2.5}.guide{stroke:#87979a;stroke-dasharray:5 5}.dot{fill:#ad4f16;stroke:#172127;stroke-width:2}.txt{fill:#172127;font:19px sans-serif}.small{fill:#59676d;font:15px sans-serif}.math{fill:#172127;font:18px monospace}@media(prefers-color-scheme:dark){.axis{stroke:#e8eee8}.dot{stroke:#e8eee8}.txt,.math{fill:#e8eee8}.small{fill:#aebcb9}}
    .bg{fill:#fffaf0}@media(prefers-color-scheme:dark){.bg{fill:#121a1d}}
  </style>
  <rect class="bg" width="960" height="500"/>
  <text class="txt" x="42" y="38">大信号状态：器件曲线 ∩ 外电路负载线</text>
  <line class="axis" x1="70" y1="420" x2="448" y2="420" marker-end="url(#a)"/><line class="axis" x1="110" y1="456" x2="110" y2="72" marker-end="url(#a)"/>
  <text class="math" x="418" y="450">vD</text><text class="math" x="67" y="83">iD</text>
  <path class="curve" d="M70 426 C190 426 280 422 326 380 C342 365 352 348 362 333 C384 292 401 170 413 80"/>
  <line class="load" x1="122" y1="108" x2="428" y2="395"/><text class="small" x="140" y="92">负载线：斜率 −1/R</text>
  <line class="guide" x1="326" y1="420" x2="326" y2="365"/><text class="small" x="305" y="445">Vγ</text>
  <circle class="dot" data-role="load-line-q" cx="362" cy="333" r="7"/><text class="txt" x="376" y="327">Q = 曲线 ∩ 负载线</text>
  <text class="small" x="235" y="476">恒压降模型把弯曲区简化为门槛 Vγ</text>
  <rect x="500" y="62" width="420" height="388" fill="none" stroke="#87979a"/>
  <text class="txt" x="522" y="96">Q 点局部：割线 ≠ 切线</text>
  <line class="axis" x1="540" y1="405" x2="880" y2="405" marker-end="url(#a)"/><line class="axis" x1="570" y1="430" x2="570" y2="130" marker-end="url(#a)"/>
  <path class="curve" d="M580 399 C650 392 705 366 748 314 C790 264 822 202 850 140"/>
  <circle class="dot" data-role="small-signal-q" cx="748" cy="314" r="7"/><line class="load" x1="570" y1="405" x2="748" y2="314"/><line class="tangent" x1="650" y1="395" x2="846" y2="233"/>
  <line class="guide" x1="748" y1="405" x2="748" y2="314"/><line class="guide" x1="570" y1="314" x2="748" y2="314"/>
  <text class="small" x="606" y="360">割线 RD=VD/ID</text><text class="small" x="766" y="246">切线 rd=(di/dv)⁻¹</text>
  <text class="math" x="596" y="436">总量 (VD, ID)</text><text class="math" x="686" y="474">增量 ṽd = rd ĩd</text>
</svg>
