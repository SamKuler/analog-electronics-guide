<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img">
  <title>桥式整流、滤波电压与二极管脉冲电流</title>
  <desc>四幅同轴波形依次为交流次级电压、全波整流电压、电容负载上的充放电纹波和峰值附近的窄二极管充电脉冲。</desc>
