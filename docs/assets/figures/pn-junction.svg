<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img">
  <title>PN 结耗尽区、内建电场与载流子运动</title>
  <desc>中间是由固定负受主离子和固定正施主离子组成的耗尽区，内建电场从 n 区指向 p 区；电子与空穴的扩散方向和电场驱动的漂移方向相反。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#006f78"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ad4f16"/></marker></defs>
  <style>
    .ink{stroke:#172127;fill:none;stroke-width:2.4}.p{fill:#ad4f16;fill-opacity:.13;stroke:#ad4f16}.n{fill:#006f78;fill-opacity:.12;stroke:#006f78}.dep{fill:#5d4b8c;fill-opacity:.10;stroke:#5d4b8c;stroke-dasharray:6 5}.teal{stroke:#006f78;fill:none;stroke-width:2.5}.orange{stroke:#ad4f16;fill:none;stroke-width:2.5}.txt{fill:#172127;font:20px sans-serif}.small{fill:#59676d;font:16px sans-serif}.ionA{fill:#ad4f16;font:bold 18px monospace}.ionD{fill:#006f78;font:bold 18px monospace}@media(prefers-color-scheme:dark){.ink{stroke:#e8eee8}.txt{fill:#e8eee8}.small{fill:#aebcb9}}
    .bg{fill:#fffaf0}@media(prefers-color-scheme:dark){.bg{fill:#121a1d}}
  </style>
  <rect class="bg" width="960" height="500"/>
  <text class="txt" x="35" y="42">热平衡 PN 结：扩散建立空间电荷，空间电荷建立内建场</text>
  <rect class="p" x="52" y="105" width="330" height="230"/><rect class="dep" x="382" y="105" width="196" height="230"/><rect class="n" x="578" y="105" width="330" height="230"/>
  <text class="txt" x="76" y="140">p 区 · 空穴多数</text><text class="txt" x="680" y="140">n 区 · 电子多数</text><text class="small" x="423" y="91">耗尽区</text>
  <g class="ionA"><text x="401" y="170">A⁻</text><text x="401" y="215">A⁻</text><text x="401" y="260">A⁻</text><text x="401" y="305">A⁻</text></g>
  <g class="ionD"><text x="520" y="170">D⁺</text><text x="520" y="215">D⁺</text><text x="520" y="260">D⁺</text><text x="520" y="305">D⁺</text></g>
  <line class="teal" x1="674" y1="192" x2="286" y2="192" marker-end="url(#a)"/><text class="small" x="405" y="360">内建电场 E<tspan baseline-shift="sub" font-size="11">bi</tspan>：n → p</text>
  <line class="orange" x1="244" y1="378" x2="510" y2="378" marker-end="url(#b)"/><text class="small" x="254" y="408">空穴扩散：p → n</text>
  <line class="orange" x1="716" y1="442" x2="450" y2="442" marker-end="url(#b)"/><text class="small" x="545" y="472">电子扩散：n → p</text>
  <line class="teal" data-role="hole-drift" x1="710" y1="378" x2="510" y2="378" marker-end="url(#a)"/><text class="small" x="572" y="408">空穴漂移：随 E 向左</text>
  <line class="teal" data-role="electron-drift" x1="250" y1="442" x2="450" y2="442" marker-end="url(#a)"/><text class="small" x="292" y="472">电子漂移：逆 E 向右</text>
</svg>
