<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img">
  <title>CE、CC、CB 的公共端与信号方向</title>
  <desc>三种BJT基本组态按输入端、交流公共端和输出端区分，公共端仍可承载直流电流。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#006f78"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ad4f16"/></marker>
  </defs>
  <style>
    .bg{fill:#fffaf0}.panel{fill:none;stroke:#87979a;stroke-width:1.5}
    .ink{fill:none;stroke:#172127;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .axis{fill:none;stroke:#172127;stroke-width:2;stroke-linecap:round}
    .teal{fill:none;stroke:#006f78;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .orange{fill:none;stroke:#ad4f16;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .node{fill:#172127}.txt{fill:#172127;font:20px sans-serif}
    .head{fill:#172127;font:bold 21px sans-serif}.small{fill:#59676d;font:16px sans-serif}
    .math{fill:#172127;font:18px monospace}
    @media(prefers-color-scheme:dark){
      .bg{fill:#121a1d}.panel{stroke:#607076}.ink,.axis{stroke:#e8eee8}.node{fill:#e8eee8}
      .txt,.head,.math{fill:#e8eee8}.small{fill:#aebcb9}
    }
</style>
  <rect class="bg" width="960" height="370"/>
<rect class="panel" x="35" y="115" width="190" height="160" rx="12"/><text class="head" x="53" y="160">CE 共射</text><text class="small"><tspan x="53" y="188">输入 B</tspan><tspan x="53" y="212">公共 E</tspan><tspan x="53" y="236">输出 C 反相</tspan></text><line class="teal" x1="225" y1="195" x2="255" y2="195" marker-end="url(#arrow)"/><rect class="panel" x="263" y="115" width="190" height="160" rx="12"/><text class="head" x="281" y="160">CC 共集</text><text class="small"><tspan x="281" y="188">输入 B</tspan><tspan x="281" y="212">公共 C</tspan><tspan x="281" y="236">输出 E 跟随</tspan></text><line class="teal" x1="453" y1="195" x2="483" y2="195" marker-end="url(#arrow)"/><rect class="panel" x="491" y="115" width="190" height="160" rx="12"/><text class="head" x="509" y="160">CB 共基</text><text class="small"><tspan x="509" y="188">输入 E</tspan><tspan x="509" y="212">公共 B</tspan><tspan x="509" y="236">输出 C 同相</tspan></text><text class="small" x="50" y="330">比较条件：中频、小信号、相同参考方向并忽略 ro。</text>
</svg>
