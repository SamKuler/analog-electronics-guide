<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img">
  <title>运算放大器负反馈的闭环逻辑与两种基本电路</title>
  <desc>上部从求差、开环增益和反馈网络说明负反馈如何压小误差；下部对比反相与同相放大器的接法、虚短条件和闭环增益。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#006f78"/></marker></defs>
  <style>
    .panel{fill:none;stroke:#87979a}.ink{stroke:#172127;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.flow{stroke:#006f78;fill:none;stroke-width:2.7}.accent{stroke:#ad4f16;fill:none;stroke-width:2.7}.node{fill:#172127}.txt{fill:#172127;font:18px sans-serif}.head{fill:#172127;font:bold 21px sans-serif}.small{fill:#59676d;font:14px sans-serif}.math{fill:#172127;font:17px monospace}@media(prefers-color-scheme:dark){.ink{stroke:#e8eee8}.node{fill:#e8eee8}.txt,.head,.math{fill:#e8eee8}.small{fill:#aebcb9}}
    .bg{fill:#fffaf0}@media(prefers-color-scheme:dark){.bg{fill:#121a1d}}
  </style>
  <rect class="bg" width="1080" height="580"/>
  <rect class="panel" x="20" y="20" width="1040" height="220" rx="8"/><text class="head" x="42" y="56">闭环不是“自动虚短”：先有高增益，再有负反馈</text>
  <text class="txt" x="45" y="142">vi</text><line class="flow" x1="72" y1="136" x2="145" y2="136" marker-end="url(#a)"/>
  <circle class="ink" cx="180" cy="136" r="35"/><text class="txt" x="165" y="124">+</text><text class="txt" x="166" y="157">−</text>
  <line class="flow" x1="215" y1="136" x2="320" y2="136" marker-end="url(#a)"/><rect class="ink" x="320" y="98" width="145" height="76"/><text class="math" x="355" y="143">A(s)</text>
  <line class="flow" x1="465" y1="136" x2="595" y2="136" marker-end="url(#a)"/><text class="txt" x="610" y="142">vo</text>
  <line class="accent" x1="570" y1="136" x2="570" y2="205"/><rect class="ink" x="340" y="185" width="135" height="42"/><text class="math" x="374" y="212">β(s)</text>
  <line class="accent" x1="570" y1="205" x2="475" y2="205"/><line class="accent" x1="340" y1="205" x2="180" y2="205"/><line class="accent" x1="180" y1="205" x2="180" y2="171" marker-end="url(#a)"/>
  <text class="math" x="700" y="112">e = vi − βvo</text><text class="math" x="700" y="145">vo/vi = A/(1 + Aβ)</text>
  <text class="small" x="700" y="178">仅当 Aβ 很大且未饱和：e ≈ 0</text><text class="small" x="700" y="204">反馈极性错了，分母会变成 1 − Aβ</text>
  <g transform="translate(20 265)"><rect class="panel" width="510" height="290" rx="8"/><text class="head" x="20" y="38">反相：输入电流流过反馈电阻</text>
    <text class="txt" x="22" y="135">vi</text><line class="ink" x1="50" y1="128" x2="130" y2="128"/><polyline class="ink" points="130,128 142,116 158,140 174,116 190,140 206,116 218,128"/><text class="small" x="148" y="103">Rin</text>
    <circle class="node" cx="235" cy="128" r="5"/><path class="ink" d="M250 78L250 188L385 133Z"/><text class="txt" x="258" y="115">−</text><text class="txt" x="258" y="168">+</text>
    <line class="ink" x1="235" y1="128" x2="250" y2="128"/><line class="ink" x1="250" y1="160" x2="218" y2="160"/><line class="ink" x1="218" y1="160" x2="218" y2="205"/><line class="ink" x1="198" y1="205" x2="238" y2="205"/><line class="ink" x1="204" y1="215" x2="232" y2="215"/>
    <line class="ink" x1="385" y1="133" x2="470" y2="133"/><text class="txt" x="440" y="120">vo</text><line class="accent" x1="435" y1="133" x2="435" y2="60"/><polyline class="accent" points="435,60 411,48 387,72 363,48 339,72 315,48 291,72 267,60 235,60 235,128"/><text class="small" x="326" y="42">Rf</text>
    <text class="math" x="90" y="258">vo/vi = −Rf/Rin</text>
  </g>
  <g transform="translate(550 265)"><rect class="panel" width="510" height="290" rx="8"/><text class="head" x="20" y="38">同相：反馈分压决定闭环增益</text>
    <text class="txt" x="25" y="162">vi</text><line class="ink" x1="55" y1="155" x2="185" y2="155"/><path class="ink" d="M185 80L185 210L340 145Z"/><text class="txt" x="195" y="125">−</text><text class="txt" x="195" y="172">+</text>
    <line class="ink" x1="340" y1="145" x2="470" y2="145"/><text class="txt" x="440" y="132">vo</text>
    <line class="accent" x1="410" y1="145" x2="410" y2="65"/><polyline class="accent" points="410,65 382,53 354,77 326,53 298,77 270,53 242,65 215,65 215,113"/><text class="small" x="309" y="45">Rf</text>
    <circle class="node" cx="215" cy="113" r="5"/><polyline class="ink" points="215,113 203,137 227,153 203,169 227,185 215,205"/><text class="small" x="236" y="172">Rg</text><line class="ink" x1="215" y1="205" x2="215" y2="225"/><line class="ink" x1="195" y1="225" x2="235" y2="225"/><line class="ink" x1="201" y1="235" x2="229" y2="235"/>
    <text class="math" x="113" y="268">vo/vi = 1 + Rf/Rg</text>
  </g>
</svg>
