<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img">
  <title>关联参考方向与功率正负</title>
  <desc>左图电流流入电压正端，正功率表示元件吸收能量；右图只反转电流参考方向，同一物理状态的功率表达式变为负号。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#006f78"/></marker>
  </defs>
  <style>
    .ink{stroke:#172127;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.teal{stroke:#006f78;fill:none;stroke-width:2.5}.orange{stroke:#ad4f16;fill:none;stroke-width:2.5}.panel{fill:none;stroke:#87979a}.txt{fill:#172127;font:20px sans-serif}.small{fill:#59676d;font:16px sans-serif}.math{fill:#172127;font:22px monospace}.plus{fill:#ad4f16;font:bold 27px sans-serif}@media(prefers-color-scheme:dark){.ink{stroke:#e8eee8}.txt,.math{fill:#e8eee8}.small{fill:#aebcb9}.panel{stroke:#607076}}
    .bg{fill:#fffaf0}@media(prefers-color-scheme:dark){.bg{fill:#121a1d}}
  </style>
  <rect class="bg" width="960" height="430"/>
  <rect class="panel" x="24" y="28" width="440" height="370" rx="8"/>
  <rect class="panel" x="496" y="28" width="440" height="370" rx="8"/>
  <text class="txt" x="48" y="66">关联参考方向</text>
  <text class="txt" x="520" y="66">只反转电流参考方向</text>
  <line class="ink" x1="88" y1="205" x2="170" y2="205"/>
  <polyline class="ink" points="170,205 186,185 210,225 234,185 258,225 282,185 306,225 322,205"/>
  <line class="ink" x1="322" y1="205" x2="402" y2="205"/>
  <line class="teal" x1="112" y1="145" x2="300" y2="145" marker-end="url(#arrow)"/>
  <text class="txt" x="194" y="130">i</text>
  <text class="plus" x="153" y="190">+</text><text class="plus" x="334" y="190">−</text>
  <line class="orange" x1="164" y1="278" x2="334" y2="278" marker-end="url(#arrow)"/>
  <text class="txt" x="212" y="308">v = V<tspan baseline-shift="sub" font-size="14">+</tspan> − V<tspan baseline-shift="sub" font-size="14">−</tspan></text>
  <text class="math" x="88" y="354">p = vi &gt; 0：吸收功率</text>
  <line class="ink" x1="560" y1="205" x2="642" y2="205"/>
  <polyline class="ink" points="642,205 658,185 682,225 706,185 730,225 754,185 778,225 794,205"/>
  <line class="ink" x1="794" y1="205" x2="874" y2="205"/>
  <line class="teal" x1="766" y1="145" x2="578" y2="145" marker-end="url(#arrow)"/>
  <text class="txt" x="672" y="130">i′ = −i</text>
  <text class="plus" x="625" y="190">+</text><text class="plus" x="806" y="190">−</text>
  <line class="orange" x1="636" y1="278" x2="806" y2="278" marker-end="url(#arrow)"/>
  <text class="math" x="560" y="354">p = −vi′：物理功率不变</text>
  <text class="small" x="48" y="385">箭头与极性是定义；计算结果的符号告诉真实方向。</text>
</svg>
