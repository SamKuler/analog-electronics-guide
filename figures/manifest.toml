description = "负反馈把低频增益除以一加T0，同时把闭环极点提高相同倍数；仅在单主极点和常数反馈系数模型中增益带宽乘积近似不变。"

[[figures]]
source = "latex/figure-6-22.tex"
output = "docs/assets/figures/figure-6-22.svg"
title = "桥接阻抗的 Miller 两端等效"
description = "原桥接阻抗连接输入和输出；在给定电压增益Av下可等效为输入对地阻抗和输出对地阻抗，但建立Av的受控放大通道仍必须保留。"

[[figures]]
source = "latex/figure-6-23.tex"
output = "docs/assets/figures/figure-6-23.svg"
title = "闭环分母与环路增益测试概念"
description = "闭环信号沿A和β回到比较点；测环路增益需在保持直流偏置与端口加载的断点注入测试量并测返回量。"

[[figures]]
source = "latex/figure-6-24.tex"
output = "docs/assets/figures/figure-6-24.svg"
