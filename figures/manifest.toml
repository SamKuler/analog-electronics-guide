description = "幅值图在二十千赫兹穿越零分贝，对应相位负一百三十五度并给出四十五度相位裕度；相位在八十千赫兹到负一百八十度时幅值为负十三点九八分贝。"

[[figures]]
source = "latex/figure-6-25.tex"
