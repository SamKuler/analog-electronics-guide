description = "两个对地输入可唯一变换为差模与共模坐标，并由平均值加减半差值重构。"

[[figures]]
source = "latex/figure-7-03.tex"
output = "docs/assets/figures/figure-7-03.svg"
title = "CMRR 的两次小信号测量"
description = "差模测量保持平均值固定并让两输入反向等量变化；共模测量令两输入同相等幅，供电、频率、负载和偏置必须相同。"

[[figures]]
source = "latex/figure-7-05.tex"
output = "docs/assets/figures/figure-7-05.svg"
