description = "四幅阶跃响应依次表示阻尼良好、欠阻尼但收敛、稳定边界附近的等幅振铃和振幅增长的不稳定响应。"

[[figures]]
source = "latex/figure-7-02.tex"
output = "docs/assets/figures/figure-7-02.svg"
