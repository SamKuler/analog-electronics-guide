description = "差模输入从负到正时，固定尾电流从Q2支路逐渐转向Q1支路；两支电流之和近似为IT，中点各为一半。"

[[figures]]
source = "latex/figure-7-06.tex"
output = "docs/assets/figures/figure-7-06.svg"
title = "差模小信号的完整符号链"
description = "纯差模时两输入分别为正负半个差模电压，理想尾源令增量尾电流为零，因此两支集电极电流增量等大反向。"

[[figures]]
source = "latex/figure-7-07.tex"
output = "docs/assets/figures/figure-7-07.svg"
title = "差分对的输出极性与增益倍数"
description = "正差模输入使左支电流增加、左输出降低，同时右支电流减少、右输出升高；差分读出幅值为单端读出的两倍。"

[[figures]]
source = "latex/figure-7-08.tex"
output = "docs/assets/figures/figure-7-08.svg"
title = "理想与有限尾电流源的共模路径"
description = "共模上升时理想尾源让发射节点近似同升并保持总电流；有限尾阻会调制总电流，对称单端输出共同移动，失配才泄漏到差分输出。"

[[figures]]
source = "latex/figure-7-11.tex"
output = "docs/assets/figures/figure-7-11.svg"
