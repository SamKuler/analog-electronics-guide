source = "latex/figure-6-16.tex"
output = "docs/assets/figures/figure-6-16.svg"
title = "高通精确幅频与相位标记"
description = "高通精确幅频与相位标记使用对数频率轴，精确曲线在截止频率处为负三点零一分贝，相位跨三个典型频点平滑变化。"

[[figures]]
source = "latex/figure-6-17.tex"
output = "docs/assets/figures/figure-6-17.svg"
title = "一阶 Bode 手绘与自检流程"
description = "先因式分解并标拐点，再累计渐近线斜率、补拐点精确修正和相位，最后检查低高频物理极限与频率单位。"

[[figures]]
source = "latex/figure-6-18.tex"
output = "docs/assets/figures/figure-6-18.svg"
