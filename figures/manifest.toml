description = "总幅频曲线在多个低频转折后进入中频平台，再在多个高频极点后以更陡斜率下降；总负三分贝点不一定等于任一单独拐点。"

[[figures]]
source = "latex/figure-6-21.tex"
output = "docs/assets/figures/figure-6-21.svg"
